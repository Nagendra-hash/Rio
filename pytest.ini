[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    browser_e2e: launches a real headless Chrome via Playwright against the live dashboard server (deselect with -m "not browser_e2e")
    browser_live: launches the real browser-use agent on local Chrome with a live model; opt-in via JARVIS_BROWSER_LIVE=1 (deselect with -m "not browser_live")
    science_live: real scientific API + analysis calls; opt-in via JARVIS_SCIENCE_LIVE=1 (deselect with -m "not science_live")
    e2e: end-to-end test against a live server (browser or not)
    visual_regression: visual regression test capturing screenshots against baselines
