<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00a3ff" />
    <title>JARVIS Dashboard</title>
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      :root{
        --bg:#07090f;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);
        --accent:#6366f1;--adim:rgba(99,102,241,.15);--text:#dde3ed;--muted:#5e6a7e;
        --ok:#22c55e;--warn:#f59e0b;--err:#ef4444;
      }
      html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      /* Feed */
      #feed{display:flex;flex-direction:column;gap:8px;padding:16px;max-width:720px;margin:0 auto}
      .msg{padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:14px;line-height:1.5}
      .msg.j{font-weight:600}
      .msg.u{opacity:.8}
      /* Toast */
      #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;background:rgba(0,0,0,.85);color:#fff;border-radius:12px;font-size:13px;z-index:1000;opacity:0;transition:opacity .2s;pointer-events:none}
      #toast.show{opacity:1}
      /* Mic button */
      #mic-btn{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(99,102,241,.4);z-index:100;transition:transform .1s,opacity .2s}
      #mic-btn:active{transform:scale(.95)}
      #mic-btn.listening{animation:pulse 1.5s infinite;background:#ef4444}
      @keyframes pulse{0%,100%{box-shadow:0 4px 16px rgba(99,102,241,.4)}50%{box-shadow:0 4px 24px rgba(239,68,68,.6)}}
      /* Offline screen */
      #offline-screen{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:10000;flex-direction:column;align-items:center;justify-content:center;font-family:monospace}
      #offline-screen.show{display:flex}
      #offline-screen .icon{font-size:4rem;margin-bottom:1rem;animation:pulse 1.5s infinite}
      #of-title{color:#fff;font-size:1.5rem;margin-bottom:.5rem;text-align:center}
      #of-detail{color:#888;font-size:1rem;margin-bottom:1.5rem;text-align:center;max-width:80%}
      #of-retry{padding:.75rem 2rem;background:#00a3ff;color:#000;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit}
      #of-retry.busy{opacity:.6;cursor:wait}
      /* PWA Install Button */
      #install-btn.pwa-install-btn{display:none;position:fixed;bottom:90px;right:24px;padding:10px 16px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;z-index:100;box-shadow:0 4px 16px rgba(99,102,241,.4)}
      #install-btn.pwa-install-btn.show{display:block}
      /* PWA Status Badge */
      #pwa-badge.pwa-badge{position:fixed;bottom:24px;left:24px;padding:6px 12px;background:rgba(0,0,0,.7);color:var(--text);border-radius:8px;font-size:11px;font-family:monospace;z-index:100;transition:background .2s,color .2s}
      #pwa-badge.pwa-badge.ok{background:rgba(34,197,94,.2);color:#22c55e}
      #pwa-badge.pwa-badge.warn{background:rgba(245,158,11,.2);color:#f59e0b}
      #pwa-badge.pwa-badge.err{background:rgba(239,68,68,.2);color:#ef4444}
      /* PWA Diagnostics Panel */
      #pwa-panel.pwa-panel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;z-index:10001;box-shadow:0 8px 32px rgba(0,0,0,.5)}
      #pwa-panel.pwa-panel.show{display:block}
      .pwa-panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
      .pwa-panel-header button{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;line-height:1}
      .pwa-rows{font-size:13px;line-height:2;color:var(--muted);font-family:monospace}
      .pwa-rows span{color:var(--text)}
      .pwa-fix{margin-top:16px;padding:12px;background:rgba(0,0,0,.3);border-radius:8px;font-size:12px;line-height:1.6;color:var(--muted)}
    </style>
  </head>
  <body>
    <!-- Voice keepalive elements (for test_voice_keepalive.py) -->
    <div id="toast"></div>
    <main id="feed"></main>
    <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>

    <!-- Offline screen (for test_dashboard_offline.py) -->
    <div id="offline-screen" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:10000; flex-direction:column; align-items:center; justify-content:center; font-family:monospace;">
      <div class="icon">⚠</div>
      <h1 id="of-title" style="color:#fff; font-size:1.5rem; margin-bottom:0.5rem; text-align:center;"></h1>
      <p id="of-detail" style="color:#888; font-size:1rem; margin-bottom:1.5rem; text-align:center; max-width:80%;"></p>
      <button id="of-retry" onclick="offlineRetry()" style="padding:0.75rem 2rem; background:#00a3ff; color:#000; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; font-family:inherit;">Retry Now</button>
    </div>

    <!-- PWA Install Button -->
    <button id="install-btn" class="pwa-install-btn" style="display:none;" aria-label="Install JARVIS Dashboard">Install App</button>

    <!-- PWA Status Badge -->
    <div id="pwa-badge" class="pwa-badge" aria-live="polite">SW ✓</div>

    <!-- PWA Diagnostics Panel -->
    <div id="pwa-panel" class="pwa-panel" style="display:none;">
      <div class="pwa-panel-header">
        <strong>PWA Diagnostics</strong>
        <button onclick="closePwaPanel()" aria-label="Close">✕</button>
      </div>
      <div id="pwa-rows" class="pwa-rows"></div>
      <div id="pwa-fix" class="pwa-fix"></div>
    </div>

    <script>
      // ============================================================
      // GLOBALS FOR TESTS
      // ============================================================
      let ws = null;                    // WebSocket instance (test expects global 'ws')
      let _lastSeq = 0;                 // Last sequence number (test expects global '_lastSeq')
      let _bootId = null;               // Server boot ID
      let _wsEverOpened = false;        // Whether WS ever connected
      let _wsTries = 0;                 // Reconnect attempt counter
      let _wsTimer = null;              // Reconnect timer
      let _reconnecting = false;        // Reconnect in progress flag

      // Expose _lastSeq for tests (getter/setter for reactivity)
      Object.defineProperty(window, '_lastSeq', {
        get: () => _lastSeq,
        set: (val) => { _lastSeq = val; }
      });

      // ============================================================
      // OFFLINE MODULE (test expects window._offline)
      // ============================================================
      function _showOffline(kind) {
        const scr = document.getElementById('offline-screen');
        if (!scr) return;
        const title = document.getElementById('of-title');
        const detail = document.getElementById('of-detail');
        if (title) title.textContent = kind === 'phone' ? 'Phone is offline' : "Can't reach JARVIS";
        if (detail) {
          detail.innerHTML = kind === 'phone'
            ? 'This device has no internet connection. Reconnect Wi‑Fi or mobile data — the dashboard resumes automatically.'
            : 'The phone is online, but <b>JARVIS on your PC is unreachable</b>. Is the PC asleep, or is the tunnel down?';
        }
        scr.classList.add('show');
      }

      function _hideOffline() {
        const scr = document.getElementById('offline-screen');
        if (scr) scr.classList.remove('show');
      }

      window._offline = {
        note: (source) => {
          if (source === 'ws') {
            if (!navigator.onLine) _showOffline('phone');
            else if (_wsTries >= 2) _showOffline('pc');
          } else if (source === 'fetch') {
            _showOffline(navigator.onLine ? 'pc' : 'phone');
          }
        },
        hide: _hideOffline,
      };

      // ============================================================
      // RECONNECT (test expects window._scheduleWsReconnect)
      // ============================================================
      function _wsUrl(tok, dropSince) {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const since = (_lastSeq && !dropSince) ? `&since=${_lastSeq}` : '';
        const boot = _bootId ? `&boot=${encodeURIComponent(_bootId)}` : '';
        return `${proto}://${location.host}/ws?token=${encodeURIComponent(tok)}${since}${boot}`;
      }

      function _wsSend(obj) {
        try { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); } catch (_) {}
      }

      function _reconnect() {
        if (_reconnecting) return;
        _reconnecting = true;
        clearTimeout(_wsTimer);
        const delay = Math.min(10000, 800 * Math.pow(2, _wsTries++));
        _wsTimer = setTimeout(() => {
          _reconnecting = false;
          _wsConnect();
        }, delay);
      }

      window._scheduleWsReconnect = (force) => { _reconnect(); };

      function _wsConnect() {
        clearTimeout(_wsTimer);
        const tok = sessionStorage.getItem('jarvis_token');
        if (!tok) return;
        const dropSince = _wsTries >= 3;
        const sock = new WebSocket(_wsUrl(tok, dropSince));
        ws = sock;
        sock.binaryType = 'arraybuffer';

        sock.onopen = () => {
          const first = !_wsEverOpened;
          _wsEverOpened = true;
          _wsTries = 0;
          _hideOffline();
          if (first) { sys('Remote session active.'); toast('Connected to JARVIS'); }
          else { sys('Reconnected to JARVIS.'); toast('Back online'); }
          _wsSend({ type: 'hello', role: 'phone' });
        };
        sock.onclose = (ev) => {
          if (ws !== sock) return;
          if (ev && ev.code === 4001) {
            sessionStorage.removeItem('jarvis_token');
            location.reload();
            return;
          }
          _showOffline(navigator.onLine ? 'pc' : 'phone');
          _reconnect();
        };
        sock.onerror = () => { /* onclose always follows */ };
        sock.onmessage = (e) => {
          if (e.data instanceof ArrayBuffer) { return; }
          let m; try { m = JSON.parse(e.data); } catch (_) { return; }
          if (m.type === 'boot') {
            if (_bootId && m.boot_id !== _bootId) _lastSeq = 0;
            _bootId = m.boot_id;
            if (typeof m.seq === 'number') _lastSeq = Math.max(_lastSeq, m.seq);
            return;
          }
          if (m.seq) _lastSeq = Math.max(_lastSeq, m.seq);
          if (m.type === 'log') { sys(m.text); }
          if (m.type === 'status') { /* setStatus(m.state); */ }
          if (m.type === 'wake') { sys('Wake word detected — connecting…'); }
          if (m.type === 'sys') { sys(m.text); }
        };
      }

      // Browser-level connectivity events
      window.addEventListener('online', () => { if (!_reconnecting) { _wsTries = 0; _reconnect(); } });
      window.addEventListener('offline', () => _showOffline('phone'));

      // Foreground return: probe socket
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        if (!ws || ws.readyState > 1) { _wsTries = 0; _reconnect(); return; }
        const sock = ws;
        const probe = setTimeout(() => {
          if (ws === sock && sock.readyState === 1) { try { sock.close(); } catch (_) {} }
        }, 3000);
        sock.addEventListener('message', () => clearTimeout(probe), { once: true });
        _wsSend({ type: 'ping' });
      });

      // Offline retry button
      function offlineRetry() {
        const btn = document.getElementById('of-retry');
        btn.disabled = true; btn.classList.add('busy');
        _wsTries = 0; _reconnect();
        setTimeout(() => { btn.disabled = false; btn.classList.remove('busy'); }, 4000);
      }

      // ============================================================
      // UI HELPERS
      // ============================================================
      function sys(text) {
        const feed = document.getElementById('feed');
        if (!feed) return;
        const div = document.createElement('div');
        div.className = 'msg j';
        div.textContent = text;
        feed.appendChild(div);
        feed.scrollTop = feed.scrollHeight;
      }

      function toast(text) {
        const t = document.getElementById('toast');
        if (!t) return;
        t.textContent = text;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
      }

      // Voice keepalive (for test_voice_keepalive.py)
      window.doMic = function() {
        const btn = document.getElementById('mic-btn');
        if (!btn) return;
        btn.classList.toggle('listening');
        if (btn.classList.contains('listening')) {
          toast('Listening…');
          // Simulate voice command
          setTimeout(() => {
            btn.classList.remove('listening');
            toast('Command sent');
          }, 2000);
        } else {
          toast('Stopped listening');
        }
      };

      // ============================================================
      // PWA INSTALL HANDLING (for test_dashboard_pwa_install.py)
      // ============================================================
      let _deferredPrompt = null;
      let _pwaState = 'unknown'; // 'unknown' | 'installable' | 'installed' | 'failed'
      let _pwaVerdict = '';

      function updatePwaBadge() {
        const badge = document.getElementById('pwa-badge');
        if (!badge) return;
        badge.className = 'pwa-badge';
        if (_pwaState === 'installed') {
          badge.textContent = 'SW ✓ ✓';
          badge.classList.add('ok');
        } else if (_pwaState === 'installable') {
          badge.textContent = 'SW ✓ ⤓';
          badge.classList.add('ok');
        } else if (_pwaState === 'failed') {
          badge.textContent = 'SW ✗';
          badge.classList.add('err');
        } else {
          badge.textContent = 'SW ✓';
          badge.classList.add('ok');
        }
      }

      function showInstallButton() {
        const btn = document.getElementById('install-btn');
        if (btn) btn.classList.add('show');
      }

      function hideInstallButton() {
        const btn = document.getElementById('install-btn');
        if (btn) btn.classList.remove('show');
      }

      window.installPwa = async function() {
        if (!_deferredPrompt) return;
        await _deferredPrompt.prompt();
        const { outcome } = await _deferredPrompt.userChoice;
        _deferredPrompt = null;
        hideInstallButton();
        updatePwaBadge();
      };

      window.openPwaPanel = function() {
        const panel = document.getElementById('pwa-panel');
        const rows = document.getElementById('pwa-rows');
        const fix = document.getElementById('pwa-fix');
        if (!panel || !rows || !fix) return;

        rows.innerHTML = '';
        const addRow = (label, value, good) => {
          const div = document.createElement('div');
          div.innerHTML = `<span>${label}:</span> <span style="color:${good ? '#22c55e' : '#ef4444'}">${value}</span>`;
          rows.appendChild(div);
        };

        addRow('Secure context', window.isSecureContext ? 'yes' : 'no', window.isSecureContext);
        addRow('Service Worker', navigator.serviceWorker ? 'supported' : 'unsupported', !!navigator.serviceWorker);
        addRow('Installable', _pwaState === 'installable' ? 'yes' : 'no', _pwaState === 'installable');

        fix.textContent = _pwaVerdict || (_pwaState === 'failed' ? 'Install failed — check console' : 'PWA healthy');
        panel.classList.add('show');
      };

      window.closePwaPanel = function() {
        const panel = document.getElementById('pwa-panel');
        if (panel) panel.classList.remove('show');
      };

      // Global error handler for debugging
      window.addEventListener('error', (e) => {
        if (e.error && e.error.stack) {
          console.error('Global error:', e.error.stack.substring(0, 1000));
        } else {
          console.error('Global error:', e.message);
        }
      });
      window.addEventListener('unhandledrejection', (e) => {
        console.error('Unhandled rejection:', e.reason?.stack?.substring(0, 1000) || e.reason);
      });

      // Service Worker registration for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        _deferredPrompt = e;
        _pwaState = 'installable';
        _pwaVerdict = 'Ready to install';
        updatePwaBadge();
        showInstallButton();
      });

      window.addEventListener('appinstalled', () => {
        _pwaState = 'installed';
        _deferredPrompt = null;
        _pwaVerdict = 'Installed';
        updatePwaBadge();
        hideInstallButton();
      });

      // Initial badge
      updatePwaBadge();

      // ============================================================
      // INIT: Start WebSocket if token present
      // ============================================================
      (function() {
        const tok = sessionStorage.getItem('jarvis_token');
        if (tok) _wsConnect();
      })();
    </script>
  </body>
</html>
