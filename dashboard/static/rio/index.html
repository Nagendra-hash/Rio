<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070a14">
  <title>RIO — Personal AI Assistant</title>
  <!-- inline SVG favicon: no /favicon.ico request, no 404 console noise -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070a14'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='18' font-weight='700' fill='%23a78bfa' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/rio/assets/styles.css">
</head>
<body>
  <!-- global media dock: present on EVERY tab — playback must not depend
       on which page the user is looking at when they ask JARVIS to play -->
  <div id="media-dock" hidden></div>
  <div class="shell">
    <!-- ── Sidebar ─────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">R</span>
        <span class="brand-text">
          <strong>RIO</strong>
          <small>Personal AI Assistant</small>
        </span>
        <button class="icon-btn compact-btn" id="compact-btn"
                aria-label="Collapse sidebar" title="Collapse sidebar"></button>
      </div>
      <nav class="nav" id="nav" aria-label="Main navigation">
        <!-- populated by app.js from the ROUTES table -->
      </nav>
      <div class="sidebar-foot">
        <div class="status-stack" id="status-stack" aria-label="System status">
          <!-- populated by app.js from /api/rio/health -->
        </div>
        <div class="user-chip">
          <span class="avatar">R</span>
          <span class="user-name">rajneesh</span>
          <span class="owner-tag" title="Owner">[R] rajneesh</span>
        </div>
      </div>
    </aside>

    <!-- ── Main column ─────────────────────────────────────────── -->
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" aria-label="Toggle navigation" title="Menu"></button>
        <div class="topbar-title">
          <strong>RIO</strong>
          <span class="topbar-sub">Personal AI Assistant</span>
        </div>
        <div class="topbar-right">
          <span class="sys-status" id="sys-status" title="Backend reachability">
            <i class="dot dot-unknown" id="sys-dot"></i>
            <span id="sys-label">checking…</span>
          </span>
          <span class="clock" id="clock" aria-label="Current time">--:--</span>
          <button class="icon-btn" id="notif-btn" aria-label="Notifications" title="Notifications">
            <span class="bell"></span><span class="notif-count" id="notif-count" hidden>0</span>
          </button>
          <a class="icon-btn" href="/settings" data-link aria-label="Settings" title="Settings" id="topbar-settings"></a>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1">
        <noscript>
          <div class="page"><p class="empty">RIO needs JavaScript to run.</p></div>
        </noscript>
      </main>

      <!-- ── Bottom status bar (real data only — wired by app.js) ── -->
      <footer class="statusbar" id="statusbar" role="contentinfo"
              aria-label="Live status">
        <span class="sb-item sb-conn" id="sb-conn" title="Backend connection">
          <i class="dot dot-unknown" id="sb-dot"></i>
          <span id="sb-backend">backend…</span>
        </span>
        <span class="sb-sep" aria-hidden="true"></span>
        <span class="sb-item" id="sb-model" title="Session model">
          <span class="sb-ico" id="sb-model-ico"></span><span id="sb-model-txt">—</span>
        </span>
        <span class="sb-sep" aria-hidden="true"></span>
        <span class="sb-item" id="sb-task" title="Current activity">
          <span class="sb-ico" id="sb-task-ico"></span><span id="sb-task-txt">idle</span>
        </span>
        <span class="sb-spacer"></span>
        <span class="sb-item" id="sb-cpu" title="CPU usage">
          <span class="sb-ico" id="sb-cpu-ico"></span><span id="sb-cpu-txt">—</span>
        </span>
        <span class="sb-item" id="sb-ram" title="Memory usage">
          <span class="sb-ico" id="sb-ram-ico"></span><span id="sb-ram-txt">—</span>
        </span>
        <span class="sb-sep" aria-hidden="true"></span>
        <span class="sb-item sb-clock" id="sb-clock" title="Date and time">—</span>
      </footer>
    </div>
  </div>

  <script src="/rio/assets/icons.js"></script>
  <script src="/rio/assets/hermes_dock.js"></script>
  <script src="/rio/assets/news.js"></script>
  <script src="/rio/assets/chat.js"></script>
  <script src="/rio/assets/agents.js"></script>
  <script src="/rio/assets/workflows.js"></script>
  <script src="/rio/assets/ops.js"></script>
  <script src="/rio/assets/brain.js"></script>
  <script src="/rio/assets/memory.js"></script>
  <script src="/rio/assets/files.js"></script>
  <script src="/rio/assets/hermes.js"></script>
  <script src="/rio/assets/system.js"></script>
  <script src="/rio/assets/tools.js"></script>
  <script src="/rio/assets/video.js"></script>
  <script src="/rio/assets/missions.js"></script>
  <script src="/rio/assets/face.js"></script>
  <script src="/rio/assets/app.js"></script>
</body>
</html>
